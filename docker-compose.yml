services:
  whatsapp-mcp:
    build: .
    container_name: whatsapp-mcp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/whatsapp-bridge/store
    environment:
      TZ: America/Sao_Paulo
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:?configure WHATSAPP_API_TOKEN in .env}
    restart: unless-stopped
