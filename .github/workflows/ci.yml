name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: cd whatsapp-mcp-server && uv sync --frozen --no-install-project

      - name: Unit tests
        env:
          TZ: America/Sao_Paulo
        run: |
          cd whatsapp-bridge && go test ./...
          cd ../whatsapp-mcp-server && uv run python test_main.py

      - name: Type checks
        run: |
          cd whatsapp-bridge && go vet ./...
          cd ../whatsapp-mcp-server && uvx --from mypy==2.3.1 mypy --ignore-missing-imports --check-untyped-defs *.py
